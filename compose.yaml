name: coffix

services:
  postgres:
    image: dhi.io/postgres:17-alpine3.24@sha256:e1467c78197f5984056a077b59439af7351920b4712cf9369c007cc084583f91
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coffix}
      POSTGRES_USER: ${POSTGRES_USER:-coffix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coffix_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Mount the existing volume root at DHI's PGDATA; no data relocation.
      - postgres_data:/var/lib/postgresql/17/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: dhi.io/redis:7.4.11-debian13@sha256:7ec74f5b6e55db00206a27a72b1875ca52f498e2b08d7b2dc7c524ccb63de795
    command: ["redis-server", "--bind", "0.0.0.0", "--protected-mode", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
