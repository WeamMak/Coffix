name: coffix

services:
  postgres:
    image: dhi.io/postgres:18-alpine3.24@sha256:c7a3bdacc95c194d9a83ea000f5fdfc40def1cd1900c1d905ce77a7568d07739
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coffix}
      POSTGRES_USER: ${POSTGRES_USER:-coffix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coffix_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Mount the existing volume root at DHI's PGDATA; no data relocation.
      - postgres_data:/var/lib/postgresql/17/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
