worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        location = /health/live { access_log off; return 200 'ok'; }
        location = /version.json { add_header Cache-Control 'no-store'; }
        # Ingress routes /api and backend /health endpoints to the API service.
        location /api/ { return 404; }
        location /assets/ { try_files $uri =404; add_header Cache-Control 'public, max-age=31536000, immutable'; }
        location / { try_files $uri $uri/ /index.html; add_header Cache-Control 'no-cache'; }
    }
}
