name: Local E2E CI
# Required status is always published; filtering happens inside the job.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      probe_path:
        description: 'Owned path for a deliberately failing routing probe (empty runs normal checks)'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CI: 'true'
  CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  UV_FROZEN: 'true'
  UV_CACHE_DIR: ${{ github.workspace }}/.local/uv-cache
  APP_ENV: test
  OTP_PROVIDER: fake
  OTP_DEV_CODE: '123456'
  PAYMENT_PROVIDER: fake
  PUSH_PROVIDER: fake
  MEDIA_STORAGE_BACKEND: local
  EMAIL_PROVIDER: disabled
jobs:
  local-e2e:
    name: local-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DOCKER_CONFIG: ${{ github.workspace }}/.local/ci-docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select changed paths
        id: changes
        env:
          CI_CHECK: local-e2e
          CI_PROBE_PATH: ${{ inputs.probe_path }}
        run: python3 scripts/ci/select.py
      - name: Deliberately failing path-filter probe
        if: steps.changes.outputs.run == 'true' && inputs.probe_path != ''
        run: exit 42
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        if: steps.changes.outputs.run == 'true'
        with:
          version: '0.11.27'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked Python dependencies
        if: steps.changes.outputs.run == 'true'
        run: uv sync --project backend --frozen
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      - name: Enable the repository-pinned pnpm
        if: steps.changes.outputs.run == 'true'
        run: corepack enable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.changes.outputs.run == 'true'
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'patches/**') }}
      - name: Install locked JavaScript dependencies
        if: steps.changes.outputs.run == 'true'
        run: corepack pnpm install --frozen-lockfile
      - name: Authenticate for the hardened test image
        id: registry
        if: steps.changes.outputs.run == 'true'
        env:
          DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
          DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
        run: |
          if [[ -z "$DHI_USERNAME" || -z "$DHI_TOKEN" ]]; then
            echo 'Configure read-only DHI_USERNAME and DHI_TOKEN repository secrets.' >&2
            exit 1
          fi
          printf '%s' "$DHI_TOKEN" | docker login dhi.io --username "$DHI_USERNAME" --password-stdin
      - name: Install Chromium
        if: steps.changes.outputs.run == 'true'
        run: corepack pnpm --filter @coffix/e2e exec playwright install chromium
      - name: Install browser system libraries on the hosted runner
        if: steps.changes.outputs.run == 'true' && !env.ACT
        run: corepack pnpm --filter @coffix/e2e exec playwright install-deps chromium
      - name: Harness lint and types
        if: steps.changes.outputs.run == 'true'
        run: |
          cd backend
          uv run ruff check ../e2e --config pyproject.toml
          uv run ty check --extra-search-path .. ../e2e/server.py ../e2e/test_harness.py ../e2e/resilience/worker.py
      - name: TypeScript driver types and load assertions
        if: steps.changes.outputs.run == 'true'
        run: |
          corepack pnpm --filter @coffix/e2e typecheck
          node --test e2e/load/acceptance.test.js
      - name: API browser load and resilience journeys
        if: steps.changes.outputs.run == 'true'
        run: bash scripts/e2e-local.sh
      - name: Clear registry login
        if: always() && steps.registry.outcome == 'success'
        run: docker logout dhi.io
