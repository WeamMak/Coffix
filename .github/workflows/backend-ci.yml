name: Backend CI
# Required status is always published; filtering happens inside the job.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      probe_path:
        description: 'Owned path for a deliberately failing routing probe (empty runs normal checks)'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CI: 'true'
  CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  UV_FROZEN: 'true'
  UV_CACHE_DIR: ${{ github.workspace }}/.local/uv-cache
  APP_ENV: test
  OTP_PROVIDER: fake
  OTP_DEV_CODE: '123456'
  PAYMENT_PROVIDER: fake
  PUSH_PROVIDER: fake
  MEDIA_STORAGE_BACKEND: local
  EMAIL_PROVIDER: disabled
jobs:
  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: ${{ inputs.probe_path == '' && 'dhi.io/postgres:17-alpine3.24@sha256:de165bfe11cdc8fd5cda469b02c1aacb94e7c6cd017841470347c81ce8ea2343' || '' }}
        credentials:
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}
        env:
          POSTGRES_USER: coffix
          POSTGRES_PASSWORD: coffix_local
          POSTGRES_DB: coffix
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U coffix -d coffix"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: ${{ inputs.probe_path == '' && 'redis:7-alpine' || '' }}
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select changed paths
        id: changes
        env:
          CI_CHECK: backend
          CI_PROBE_PATH: ${{ inputs.probe_path }}
        run: python3 scripts/ci/select.py
      - name: Deliberately failing path-filter probe
        if: steps.changes.outputs.run == 'true' && inputs.probe_path != ''
        run: exit 42
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        if: steps.changes.outputs.run == 'true'
        with:
          version: '0.11.27'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked Python dependencies
        if: steps.changes.outputs.run == 'true'
        run: uv sync --project backend --frozen
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      - name: Enable the repository-pinned pnpm
        if: steps.changes.outputs.run == 'true'
        run: corepack enable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.changes.outputs.run == 'true'
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'patches/**') }}
      - name: Install locked JavaScript dependencies
        if: steps.changes.outputs.run == 'true'
        run: corepack pnpm install --frozen-lockfile
      - name: Format changed Python and check whitespace
        if: steps.changes.outputs.run == 'true'
        run: python3 scripts/ci/format.py backend
      - name: Lint
        if: steps.changes.outputs.run == 'true'
        run: uv run --project backend ruff check backend
      - name: Types
        if: steps.changes.outputs.run == 'true'
        run: uv run --project backend ty check backend/src backend/tests backend/migrations
      - name: Unit integration API and provider contracts
        if: steps.changes.outputs.run == 'true'
        run: uv run --project backend pytest backend/tests -q
      - name: Clean and baseline migrations plus seed twice
        if: steps.changes.outputs.run == 'true'
        run: bash scripts/check-migrations.sh
      - name: OpenAPI and client drift
        if: steps.changes.outputs.run == 'true'
        run: bash scripts/check-generated.sh
