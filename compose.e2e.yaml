# A standalone file: never merge with the developer compose.yaml.
services:
  postgres:
    image: dhi.io/postgres:17-alpine3.24@sha256:e1467c78197f5984056a077b59439af7351920b4712cf9369c007cc084583f91
    environment:
      POSTGRES_DB: coffix_e2e_${COFFIX_E2E_RUN_ID:?Run scripts/e2e-local.sh}
      POSTGRES_USER: coffix_e2e
      POSTGRES_PASSWORD: ${COFFIX_E2E_DB_PASSWORD:?Run scripts/e2e-local.sh}
    ports: ["127.0.0.1::5432"]
    volumes: ["postgres_data:/var/lib/postgresql/17/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffix_e2e -d $$POSTGRES_DB"]
      interval: 1s
      timeout: 5s
      retries: 30
  redis:
    image: dhi.io/redis:7.4.11-debian13@sha256:7ec74f5b6e55db00206a27a72b1875ca52f498e2b08d7b2dc7c524ccb63de795
    command: ["redis-server", "--requirepass", "${E2E_CONTROL_SECRET:?Run scripts/e2e-local.sh}"]
    environment:
      REDISCLI_AUTH: ${E2E_CONTROL_SECRET:?Run scripts/e2e-local.sh}
    ports: ["127.0.0.1::6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 5s
      retries: 30
volumes:
  postgres_data:
  redis_data:
