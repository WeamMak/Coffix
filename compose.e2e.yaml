# A standalone file: never merge with the developer compose.yaml.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: coffix_e2e_${COFFIX_E2E_RUN_ID:?Run scripts/e2e-local.sh}
      POSTGRES_USER: coffix_e2e
      POSTGRES_PASSWORD: ${COFFIX_E2E_DB_PASSWORD:?Run scripts/e2e-local.sh}
    ports: ["127.0.0.1::5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffix_e2e -d $$POSTGRES_DB"]
      interval: 1s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${E2E_CONTROL_SECRET:?Run scripts/e2e-local.sh}"]
    environment:
      REDISCLI_AUTH: ${E2E_CONTROL_SECRET:?Run scripts/e2e-local.sh}
    ports: ["127.0.0.1::6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 5s
      retries: 30
volumes:
  postgres_data:
  redis_data:
